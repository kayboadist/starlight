apiVersion: apps/v1
kind: Deployment
metadata:
  name: starlight-deployment
  namespace: starlight
  labels:
    app: starlight-app
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: starlight-app
  template:
    metadata:
      labels:
        app: starlight-app
    spec:
      containers:
      - name: starlight
        image: kayboadist/2nitestarlight:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
